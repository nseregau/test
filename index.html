<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js Demo</title>
    <style>
        * { margin: 0; padding: 0; }
        body { overflow: hidden; background: #000; }
        canvas { display: block; }
        #info {
            position: absolute;
            top: 1rem;
            left: 1rem;
            color: #fff;
            font-family: sans-serif;
            font-size: 0.9rem;
            background: rgba(0,0,0,0.5);
            padding: 0.5rem 1rem;
            border-radius: 6px;
        }
    </style>
</head>
<body>
    <div id="info">Three.js on GitHub Pages</div>

    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
        }
    }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

        // Scene
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111122);

        // Camera
        const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 100);
        camera.position.set(3, 2, 4);

        // Renderer
        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(innerWidth, innerHeight);
        renderer.setPixelRatio(devicePixelRatio);
        document.body.appendChild(renderer.domElement);

        // Controls
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;

        // Lights
        const ambientLight = new THREE.AmbientLight(0x404040, 2);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 3);
        dirLight.position.set(5, 10, 7);
        scene.add(dirLight);

        const pointLight = new THREE.PointLight(0x4488ff, 5, 20);
        pointLight.position.set(-3, 3, -3);
        scene.add(pointLight);

        // Floor
        const floorGeo = new THREE.PlaneGeometry(20, 20);
        const floorMat = new THREE.MeshStandardMaterial({ color: 0x222233 });
        const floor = new THREE.Mesh(floorGeo, floorMat);
        floor.rotation.x = -Math.PI / 2;
        floor.position.y = -1;
        scene.add(floor);

        // Objects
        const torusGeo = new THREE.TorusKnotGeometry(0.8, 0.25, 128, 32);
        const torusMat = new THREE.MeshStandardMaterial({
            color: 0x44aaff,
            metalness: 0.6,
            roughness: 0.2,
        });
        const torusKnot = new THREE.Mesh(torusGeo, torusMat);
        torusKnot.position.y = 0.5;
        scene.add(torusKnot);

        // Floating cubes
        const cubes = [];
        const cubeGeo = new THREE.BoxGeometry(0.4, 0.4, 0.4);
        for (let i = 0; i < 8; i++) {
            const mat = new THREE.MeshStandardMaterial({
                color: new THREE.Color().setHSL(i / 8, 0.8, 0.5),
                metalness: 0.3,
                roughness: 0.4,
            });
            const cube = new THREE.Mesh(cubeGeo, mat);
            const angle = (i / 8) * Math.PI * 2;
            cube.position.set(Math.cos(angle) * 2.5, 0.5, Math.sin(angle) * 2.5);
            cube.userData = { angle, speed: 0.5 + Math.random() * 0.5 };
            scene.add(cube);
            cubes.push(cube);
        }

        // Animation
        const clock = new THREE.Clock();

        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();

            torusKnot.rotation.x = t * 0.3;
            torusKnot.rotation.y = t * 0.5;

            cubes.forEach((cube) => {
                const { angle, speed } = cube.userData;
                cube.position.y = 0.5 + Math.sin(t * speed + angle) * 0.5;
                cube.rotation.x = t * speed;
                cube.rotation.z = t * speed * 0.7;
            });

            pointLight.position.x = Math.sin(t) * 4;
            pointLight.position.z = Math.cos(t) * 4;

            controls.update();
            renderer.render(scene, camera);
        }

        animate();

        // Resize
        window.addEventListener('resize', () => {
            camera.aspect = innerWidth / innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(innerWidth, innerHeight);
        });
    </script>
</body>
</html>
