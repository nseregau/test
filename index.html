<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hello World</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Georgia, "Times New Roman", serif;
      background:
        radial-gradient(circle at 18% 22%, rgba(255, 92, 135, 0.45), transparent 42%),
        radial-gradient(circle at 82% 18%, rgba(88, 196, 255, 0.42), transparent 38%),
        radial-gradient(circle at 72% 78%, rgba(168, 85, 247, 0.4), transparent 40%),
        radial-gradient(circle at 24% 80%, rgba(250, 204, 21, 0.35), transparent 36%),
        #14122a;
      color: #fff7ed;
    }

    h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 400;
      letter-spacing: 0.04em;
      background: linear-gradient(
        90deg,
        #ff5c87 0%,
        #ffb020 22%,
        #ffe566 40%,
        #4ade80 58%,
        #38bdf8 76%,
        #c084fc 100%
      );
      background-size: 140% 100%;
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
      filter: drop-shadow(0 8px 24px rgba(255, 92, 135, 0.35));
    }
  </style>
</head>
<body>
  <h1>Hello World</h1>
</body>
</html>
