<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deer Calls</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

  <div class="layout">

    <!-- Sidebar -->
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 32 32" fill="none">
            <path d="M16 26 C16 26 10 21 9 15 C8 9 11 4 14 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M16 26 C16 26 22 21 23 15 C24 9 21 4 18 3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <circle cx="16" cy="13" r="5" fill="currentColor"/>
            <path d="M13 9 L10 5 M10 5 L7 3 M10 5 L11 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <path d="M19 9 L22 5 M22 5 L25 3 M22 5 L21 2.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
            <ellipse cx="16" cy="22" rx="5.5" ry="4" fill="currentColor" opacity="0.8"/>
            <path d="M13 25.5 L12 29 M19 25.5 L20 29" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div>
          <div class="brand-name">Deer Calls</div>
          <div class="brand-sub">Sound Library</div>
        </div>
      </div>

      <nav class="sidebar-nav">
        <button class="nav-item active" data-cat="all">
          <span class="nav-dot"></span>
          All Calls
          <span class="nav-count" id="count-all">15</span>
        </button>
        <button class="nav-item" data-cat="grunt">
          <span class="nav-dot" style="background:#d4a843"></span>
          Grunt
          <span class="nav-count" id="count-grunt">4</span>
        </button>
        <button class="nav-item" data-cat="bleat">
          <span class="nav-dot" style="background:#5a9e6f"></span>
          Bleat
          <span class="nav-count" id="count-bleat">3</span>
        </button>
        <button class="nav-item" data-cat="rattle">
          <span class="nav-dot" style="background:#c47a3a"></span>
          Rattle
          <span class="nav-count" id="count-rattle">3</span>
        </button>
        <button class="nav-item" data-cat="snort">
          <span class="nav-dot" style="background:#6a8fc4"></span>
          Snort
          <span class="nav-count" id="count-snort">3</span>
        </button>
        <button class="nav-item" data-cat="fawn">
          <span class="nav-dot" style="background:#a87cc4"></span>
          Fawn
          <span class="nav-count" id="count-fawn">2</span>
        </button>
      </nav>

      <div class="sidebar-bottom">
        <button class="side-action" id="favToggle">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/>
          </svg>
          Favourites
        </button>
        <button class="side-action" id="timerBtn">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 3"/><path d="M9.5 2.5h5"/>
          </svg>
          <span id="timerLabel">Sleep Timer</span>
        </button>
      </div>
    </aside>

    <!-- Main content -->
    <main class="main">

      <!-- Top bar -->
      <div class="topbar">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
            <circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/>
          </svg>
          <input type="text" id="searchInput" placeholder="Search…" />
          <button id="searchClear" style="display:none">✕</button>
        </div>
        <div class="topbar-right">
          <button class="repeat-btn" id="repeatBtn" title="Repeat">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/>
              <path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>
            </svg>
          </button>
        </div>
      </div>

      <!-- Section title -->
      <div class="section-header">
        <h1 class="section-title" id="sectionTitle">All Calls</h1>
        <span class="section-count" id="sectionCount">15 sounds</span>
      </div>

      <!-- Calls list -->
      <div class="calls-list" id="callsList"></div>

      <div class="empty-state" id="emptyState" style="display:none">
        <div class="empty-icon">◎</div>
        <p>Nothing found</p>
      </div>

    </main>
  </div>

  <!-- Player -->
  <div class="player" id="player">
    <div class="player-left">
      <button class="p-btn" id="prevBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button class="p-play" id="mainPlayBtn">
        <svg class="ico-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ico-pause" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
      </button>
      <button class="p-btn" id="nextBtn">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
      </button>
    </div>

    <div class="player-center">
      <div class="p-track">
        <span class="p-name" id="playerName">Select a call to play</span>
        <span class="p-cat" id="playerCat"></span>
      </div>
      <div class="p-progress">
        <span class="p-time" id="timeElapsed">0:00</span>
        <div class="p-bar" id="progressBar">
          <div class="p-fill" id="progressFill"></div>
        </div>
        <span class="p-time" id="timeDuration">0:00</span>
      </div>
    </div>

    <div class="player-right">
      <div class="waveform" id="waveform">
        <span></span><span></span><span></span><span></span><span></span>
      </div>
      <div class="vol-wrap">
        <svg viewBox="0 0 24 24" fill="currentColor" class="vol-ico">
          <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3A4.5 4.5 0 0 0 14 7.97v8.05c1.48-.73 2.5-2.25 2.5-4.02z"/>
        </svg>
        <input type="range" class="vol-slider" id="volumeSlider" min="0" max="100" value="80" />
      </div>
    </div>
  </div>

  <!-- Timer Modal -->
  <div class="overlay" id="timerModal">
    <div class="modal">
      <div class="modal-top">
        <h2>Sleep Timer</h2>
        <button id="timerClose">✕</button>
      </div>
      <div class="timer-grid">
        <button class="t-opt" data-min="5">5 min</button>
        <button class="t-opt" data-min="10">10 min</button>
        <button class="t-opt" data-min="15">15 min</button>
        <button class="t-opt" data-min="30">30 min</button>
        <button class="t-opt" data-min="60">1 hour</button>
        <button class="t-opt t-off" data-min="0">Off</button>
      </div>
      <div class="timer-info" id="timerInfo" style="display:none">
        Stops in <strong id="timerCountdown">—</strong>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
