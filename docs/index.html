<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fantasy Town Explorer</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Arial, sans-serif; }

    #loading {
      position: fixed; inset: 0; z-index: 20;
      background: linear-gradient(135deg, #1a0a2e 0%, #16213e 50%, #0f3460 100%);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      color: #fff;
    }
    #loading h1 {
      font-size: 38px; margin-bottom: 24px;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #loading .bar-bg {
      width: 320px; height: 8px; background: rgba(255,255,255,0.15);
      border-radius: 4px; overflow: hidden;
    }
    #loading .bar-fill {
      height: 100%; width: 0%; border-radius: 4px;
      background: linear-gradient(90deg, #FFD700, #FF8C00);
      transition: width 0.15s;
    }
    #loading .status { margin-top: 12px; font-size: 13px; opacity: 0.5; }

    #blocker {
      position: fixed; inset: 0; z-index: 10;
      background: rgba(0, 0, 0, 0.55);
      display: none; align-items: center; justify-content: center;
      cursor: pointer;
    }
    #instructions {
      text-align: center; color: #fff;
      text-shadow: 0 0 20px rgba(255, 170, 0, 0.5);
    }
    #instructions h1 {
      font-size: 42px; margin-bottom: 16px;
      background: linear-gradient(135deg, #FFD700, #FF8C00);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    #instructions p { font-size: 16px; opacity: 0.8; margin: 6px 0; }
    #instructions .keys { font-size: 14px; opacity: 0.5; margin-top: 20px; }
    #instructions .keys kbd {
      display: inline-block; padding: 3px 8px; margin: 0 2px;
      border: 1px solid rgba(255,255,255,0.3); border-radius: 4px;
      background: rgba(255,255,255,0.1); font-family: monospace;
    }
    #hud {
      position: fixed; bottom: 16px; left: 16px; z-index: 5;
      color: rgba(255, 255, 255, 0.5); font-size: 12px; font-family: monospace;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="loading">
    <h1>Fantasy Town Explorer</h1>
    <div class="bar-bg"><div class="bar-fill" id="loadBar"></div></div>
    <div class="status" id="loadStatus">Loading models...</div>
  </div>
  <div id="blocker">
    <div id="instructions">
      <h1>Fantasy Town Explorer</h1>
      <p>Click to enter the world</p>
      <div class="keys">
        <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> Move &nbsp;&nbsp;
        <kbd>Mouse</kbd> Look &nbsp;&nbsp;
        <kbd>Space</kbd> Jump &nbsp;&nbsp;
        <kbd>Esc</kbd> Pause
      </div>
    </div>
  </div>
  <div id="hud"></div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.172.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.172.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { PointerLockControls } from 'three/addons/controls/PointerLockControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // ── Constants ─────────────────────────────────────────────
    const S = 3;          // scale for all Kenney models (1 tile = 3m)
    const PI = Math.PI;
    const HALF_PI = PI / 2;

    // Wall facing rotations (model default faces -X)
    const FACE = { W: 0, N: HALF_PI, E: PI, S: -HALF_PI };

    // ── Scene Setup ───────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0xb0a0c8, 0.006);

    const camera = new THREE.PerspectiveCamera(75, innerWidth / innerHeight, 0.1, 600);
    camera.position.set(0, 1.6, 35);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.0;
    document.body.appendChild(renderer.domElement);

    // ── Lighting ──────────────────────────────────────────────
    scene.add(new THREE.HemisphereLight(0x87CEEB, 0x3a6b3a, 0.6));
    scene.add(new THREE.AmbientLight(0x404060, 0.4));

    const sun = new THREE.DirectionalLight(0xFFE4B5, 1.4);
    sun.position.set(50, 80, 30);
    sun.castShadow = true;
    sun.shadow.mapSize.set(2048, 2048);
    sun.shadow.camera.near = 0.5;
    sun.shadow.camera.far = 250;
    const sc = 80;
    sun.shadow.camera.left = -sc;
    sun.shadow.camera.right = sc;
    sun.shadow.camera.top = sc;
    sun.shadow.camera.bottom = -sc;
    scene.add(sun);

    // ── Sky Dome ──────────────────────────────────────────────
    const skyMat = new THREE.ShaderMaterial({
      uniforms: {
        topColor:    { value: new THREE.Color(0x0055aa) },
        bottomColor: { value: new THREE.Color(0xffd89b) },
        offset:      { value: 20 },
        exponent:    { value: 0.5 },
      },
      vertexShader: `
        varying vec3 vWorldPos;
        void main() {
          vWorldPos = (modelMatrix * vec4(position, 1.0)).xyz;
          gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0);
        }`,
      fragmentShader: `
        uniform vec3 topColor, bottomColor;
        uniform float offset, exponent;
        varying vec3 vWorldPos;
        void main() {
          float h = normalize(vWorldPos + offset).y;
          gl_FragColor = vec4(mix(bottomColor, topColor, max(pow(max(h,0.0), exponent), 0.0)), 1.0);
        }`,
      side: THREE.BackSide,
    });
    scene.add(new THREE.Mesh(new THREE.SphereGeometry(400, 32, 15), skyMat));

    // ── Ground ────────────────────────────────────────────────
    const mat = (color, opts = {}) => new THREE.MeshLambertMaterial({ color, ...opts });

    const groundGeo = new THREE.PlaneGeometry(300, 300, 80, 80);
    const verts = groundGeo.attributes.position.array;
    for (let i = 2; i < verts.length; i += 3) verts[i] += (Math.random() - 0.5) * 0.35;
    groundGeo.rotateX(-PI / 2);
    groundGeo.computeVertexNormals();
    const ground = new THREE.Mesh(groundGeo, mat(0x4a7c3f));
    ground.receiveShadow = true;
    scene.add(ground);

    // ── Water Pond ────────────────────────────────────────────
    const waterGeo = new THREE.CircleGeometry(7, 32);
    waterGeo.rotateX(-PI / 2);
    const waterMesh = new THREE.Mesh(waterGeo, new THREE.MeshPhongMaterial({
      color: 0x3a7faa, transparent: true, opacity: 0.65, shininess: 100, specular: 0x222244,
    }));
    waterMesh.position.set(22, 0.05, -18);
    scene.add(waterMesh);

    // ── Floating Particles ────────────────────────────────────
    const particleCount = 250;
    const particleGeo = new THREE.BufferGeometry();
    const pPos = new Float32Array(particleCount * 3);
    const pVel = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      pPos[i]     = (Math.random() - 0.5) * 100;
      pPos[i + 1] = Math.random() * 15 + 1;
      pPos[i + 2] = (Math.random() - 0.5) * 100;
      pVel[i]     = (Math.random() - 0.5) * 0.3;
      pVel[i + 1] = (Math.random() - 0.5) * 0.15;
      pVel[i + 2] = (Math.random() - 0.5) * 0.3;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
    const particles = new THREE.Points(particleGeo, new THREE.PointsMaterial({
      color: 0xFFD700, size: 0.15, transparent: true, opacity: 0.6,
    }));
    scene.add(particles);

    // ── Model Loader ──────────────────────────────────────────
    const gltfLoader = new GLTFLoader();
    const modelCache = {};

    const MODELS_TO_LOAD = [
      // Walls (stone)
      'wall', 'wallDoor', 'wallDoorwayRound', 'wallWindowGlass', 'wallWindowShutters',
      'wallWindowRound', 'wallCorner', 'wallCornerDetail', 'wallBroken', 'wallArch', 'wallArchTop',
      'wallBlock', 'wallHalf',
      // Walls (wood)
      'wallWood', 'wallWoodDoor', 'wallWoodWindowGlass', 'wallWoodWindowShutters',
      'wallWoodCorner', 'wallWoodBroken',
      // Roofs (normal)
      'roof', 'roofCorner', 'roofCornerInner', 'roofFlat',
      'roofGable', 'roofGableDetail', 'roofGableEnd', 'roofGableTop', 'roofPoint',
      'roofLeft', 'roofRight', 'roofWindow',
      // Roofs (high)
      'roofHigh', 'roofHighCorner', 'roofHighCornerInner', 'roofHighFlat',
      'roofHighGable', 'roofHighGableDetail', 'roofHighGableEnd', 'roofHighGableTop', 'roofHighPoint',
      'roofHighLeft', 'roofHighRight',
      // Trees
      'tree', 'treeHigh', 'treeCrooked', 'treeHighRound',
      // Roads
      'road', 'roadBend', 'roadCorner', 'roadEdge',
      // Fences & hedges
      'fence', 'fenceGate', 'hedge', 'hedgeGate',
      // Props
      'cart', 'lantern', 'bannerRed', 'bannerGreen',
      'rockLarge', 'rockSmall', 'rockWide',
      'pillarStone', 'stall', 'stallGreen', 'stallRed',
      // Structures
      'fountainRound', 'windmill', 'watermill',
      // Details
      'chimney', 'chimneyTop', 'overhang', 'stairsStone',
    ];

    async function loadAllModels() {
      const bar = document.getElementById('loadBar');
      const status = document.getElementById('loadStatus');
      let loaded = 0;
      const total = MODELS_TO_LOAD.length;

      const promises = MODELS_TO_LOAD.map(name =>
        gltfLoader.loadAsync(`models/${name}.glb`).then(gltf => {
          modelCache[name] = gltf.scene;
          loaded++;
          bar.style.width = `${(loaded / total * 100).toFixed(0)}%`;
          status.textContent = `Loading models... ${loaded}/${total}`;
        }).catch(err => {
          console.warn(`Failed to load ${name}:`, err);
          loaded++;
          bar.style.width = `${(loaded / total * 100).toFixed(0)}%`;
        })
      );
      await Promise.all(promises);
    }

    // ── Model Placement Helpers ───────────────────────────────
    function place(name, x, y, z, rotY = 0, scale = S) {
      const src = modelCache[name];
      if (!src) return null;
      const m = src.clone();
      m.position.set(x, y, z);
      m.rotation.y = rotY;
      m.scale.setScalar(scale);
      m.traverse(c => {
        if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
      });
      scene.add(m);
      return m;
    }

    // Place a model at grid coordinates (tile units), auto-scaled
    function placeGrid(name, gx, gy, gz, rotY = 0) {
      return place(name, gx * S, gy * S, gz * S, rotY);
    }

    // ── Building Construction ─────────────────────────────────
    // Wall rotation: model default face points -X
    // FACE.W=0(-X), FACE.N=π/2(+Z), FACE.E=π(+X), FACE.S=-π/2(-Z)

    function buildRect(cx, cz, w, d, floors, wallPicker, roofType, opts = {}) {
      // cx, cz = world position of building center
      // w = tiles wide (X-axis), d = tiles deep (Z-axis)
      // wallPicker(face, index, floor) → model name
      const g = new THREE.Group();

      for (let f = 0; f < floors; f++) {
        // South face (facing -Z)
        for (let i = 0; i < w; i++) {
          const m = modelCache[wallPicker('S', i, f)]?.clone();
          if (m) { m.position.set(i, f, 0); m.rotation.y = FACE.S; g.add(m); }
        }
        // North face (facing +Z)
        for (let i = 0; i < w; i++) {
          const m = modelCache[wallPicker('N', i, f)]?.clone();
          if (m) { m.position.set(i, f, d); m.rotation.y = FACE.N; g.add(m); }
        }
        // West face (facing -X)
        for (let i = 0; i < d; i++) {
          const m = modelCache[wallPicker('W', i, f)]?.clone();
          if (m) { m.position.set(0, f, i); m.rotation.y = FACE.W; g.add(m); }
        }
        // East face (facing +X)
        for (let i = 0; i < d; i++) {
          const m = modelCache[wallPicker('E', i, f)]?.clone();
          if (m) { m.position.set(w, f, i); m.rotation.y = FACE.E; g.add(m); }
        }
      }

      // Roof
      const ry = floors;
      if (roofType === 'pointed') {
        // Pointed roof with gables on Z ends, slopes on X sides
        for (let iz = 0; iz < d; iz++) {
          const rn = (iz === 0) ? 'roofGableEnd' : (iz === d - 1) ? 'roofGableEnd' : 'roof';
          for (let ix = 0; ix < w; ix++) {
            const m = modelCache[rn]?.clone();
            if (m) { m.position.set(ix, ry, iz); g.add(m); }
          }
        }
        // Gable details on ends
        for (let ix = 0; ix < w; ix++) {
          const mS = modelCache['roofGable']?.clone();
          if (mS) { mS.position.set(ix, ry, 0); mS.rotation.y = FACE.S; g.add(mS); }
          const mN = modelCache['roofGable']?.clone();
          if (mN) { mN.position.set(ix, ry, d); mN.rotation.y = FACE.N; g.add(mN); }
        }
      } else if (roofType === 'high') {
        for (let iz = 0; iz < d; iz++) {
          for (let ix = 0; ix < w; ix++) {
            const m = modelCache['roofHigh']?.clone();
            if (m) { m.position.set(ix, ry, iz); g.add(m); }
          }
        }
        for (let ix = 0; ix < w; ix++) {
          const mS = modelCache['roofHighGable']?.clone();
          if (mS) { mS.position.set(ix, ry, 0); mS.rotation.y = FACE.S; g.add(mS); }
          const mN = modelCache['roofHighGable']?.clone();
          if (mN) { mN.position.set(ix, ry, d); mN.rotation.y = FACE.N; g.add(mN); }
        }
      } else {
        // Flat roof
        for (let iz = 0; iz < d; iz++) {
          for (let ix = 0; ix < w; ix++) {
            const m = modelCache['roofFlat']?.clone();
            if (m) { m.position.set(ix, ry, iz); g.add(m); }
          }
        }
      }

      // Chimney
      if (opts.chimney) {
        const ch = modelCache['chimney']?.clone();
        if (ch) { ch.position.set(w - 1, ry, d - 1); g.add(ch); }
        const ct = modelCache['chimneyTop']?.clone();
        if (ct) { ct.position.set(w - 1, ry + 1, d - 1); g.add(ct); }
      }

      g.scale.setScalar(S);
      g.position.set(cx - (w * S) / 2, 0, cz - (d * S) / 2);

      g.traverse(c => {
        if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
      });
      scene.add(g);
      return g;
    }

    // Wall picker factories
    function stoneHouse(doorFace = 'S', doorIdx = 0) {
      return (face, i, floor) => {
        if (floor === 0 && face === doorFace && i === doorIdx) return 'wallDoor';
        if (floor === 0) return (i % 2 === 1) ? 'wallWindowShutters' : 'wall';
        return (i % 2 === 0) ? 'wallWindowGlass' : 'wall';
      };
    }

    function woodHouse(doorFace = 'S', doorIdx = 0) {
      return (face, i, floor) => {
        if (floor === 0 && face === doorFace && i === doorIdx) return 'wallWoodDoor';
        if (floor === 0) return (i % 2 === 1) ? 'wallWoodWindowShutters' : 'wallWood';
        return (i % 2 === 0) ? 'wallWoodWindowGlass' : 'wallWood';
      };
    }

    function mixedHouse(doorFace = 'S', doorIdx = 0) {
      return (face, i, floor) => {
        if (floor === 0 && face === doorFace && i === doorIdx) return 'wallDoor';
        if (floor === 0) return (i % 2 === 1) ? 'wallWindowShutters' : 'wall';
        if (floor === 1 && face === doorFace && i === doorIdx) return 'wallWoodWindowGlass';
        return (floor === 1) ? ((i % 2 === 0) ? 'wallWoodWindowGlass' : 'wallWood') : 'wall';
      };
    }

    // ── Torch Creator ─────────────────────────────────────────
    const torches = [];
    function createTorch(x, y, z) {
      const light = new THREE.PointLight(0xFF6600, 1.0, 15, 2);
      light.position.set(x, y + 0.5, z);
      scene.add(light);
      const flame = new THREE.Mesh(
        new THREE.SphereGeometry(0.12, 6, 6),
        new THREE.MeshBasicMaterial({ color: 0xFF8800 })
      );
      flame.position.set(x, y + 0.45, z);
      scene.add(flame);
      torches.push({ light, flame });
    }

    // ── Build the Town ────────────────────────────────────────
    function buildTown() {

      // ── Roads (along Z-axis, centered at X=0) ──────────────
      for (let z = -12; z <= 12; z++) {
        placeGrid('road', 0, 0, z);
      }
      // Side road along X
      for (let x = -6; x <= 6; x++) {
        if (x === 0) continue; // skip center (already has main road)
        placeGrid('road', x, 0, 2);
      }
      // Road bends at intersection
      placeGrid('roadCorner', -1, 0, 1);
      placeGrid('roadCorner', 1, 0, 1, HALF_PI);
      placeGrid('roadCorner', -1, 0, 3, -HALF_PI);
      placeGrid('roadCorner', 1, 0, 3, PI);

      // ── Buildings ──────────────────────────────────────────

      // 1. Stone cottage (left of road, near entrance)
      buildRect(-8, 24, 3, 2, 1, stoneHouse('E', 0), 'pointed', { chimney: true });

      // 2. Tall wood house (left of road)
      buildRect(-9, 15, 2, 3, 2, woodHouse('E', 1), 'high', { chimney: true });

      // 3. Large stone tavern (left of road, center area)
      buildRect(-10, 4, 3, 3, 2, mixedHouse('E', 1), 'pointed');

      // 4. Small wood shop (left of road, south)
      buildRect(-8, -6, 2, 2, 1, woodHouse('E', 0), 'pointed');

      // 5. Stone house with arch (left, far south)
      buildRect(-9, -16, 3, 2, 1, stoneHouse('E', 1), 'high');

      // 6. Wood house (right of road, near entrance)
      buildRect(7, 22, 3, 2, 1, woodHouse('W', 1), 'pointed', { chimney: true });

      // 7. Tall stone house (right of road)
      buildRect(8, 13, 2, 3, 2, stoneHouse('W', 0), 'high');

      // 8. Large mixed workshop (right of road)
      buildRect(8, 2, 3, 3, 2, mixedHouse('W', 1), 'pointed', { chimney: true });

      // 9. Small stone shop (right of road, south)
      buildRect(7, -8, 2, 2, 1, stoneHouse('W', 0), 'pointed');

      // 10. Wood house (right, far south)
      buildRect(8, -18, 3, 2, 2, woodHouse('W', 1), 'high', { chimney: true });

      // ── Windmill (north landmark) ──────────────────────────
      place('windmill', 0, 0, -30, 0, S * 3);

      // ── Watermill (near pond) ──────────────────────────────
      place('watermill', 18, 0, -18, HALF_PI, S * 2.5);

      // ── Fountain (town center) ─────────────────────────────
      place('fountainRound', 0, 0, 6, 0, S * 2);

      // ── Market Stalls ──────────────────────────────────────
      place('stallGreen', -14, 0, 6, HALF_PI, S);
      place('stallRed', -14, 0, 9, HALF_PI, S);
      place('stall', 14, 0, 6, -HALF_PI, S);

      // ── Cart ───────────────────────────────────────────────
      place('cart', 4, 0, 20, 0.3, S);
      place('cart', -15, 0, -4, -0.5, S);

      // ── Lanterns along road ────────────────────────────────
      for (let z = -10; z <= 12; z += 4) {
        place('lantern', -2.5, 0, z * S, 0, S);
        place('lantern',  2.5, 0, z * S, 0, S);
        // Add torch lights near lanterns
        createTorch(-2.5, S * 1.5, z * S);
        createTorch( 2.5, S * 1.5, z * S);
      }

      // ── Fences ─────────────────────────────────────────────
      // Along the main road edges (decorative)
      for (let z = -10; z <= -5; z++) {
        placeGrid('fence', -1, 0, z);
        placeGrid('fence', 1, 0, z, PI);
      }
      // Fence around market area
      for (let x = -6; x <= -3; x++) {
        placeGrid('fence', x, 0, 4, -HALF_PI);
        placeGrid('fence', x, 0, 11, HALF_PI);
      }
      placeGrid('fenceGate', -5, 0, 7, 0);

      // Fence along right side
      for (let z = 6; z <= 10; z++) {
        placeGrid('fence', 5, 0, z, PI);
      }

      // ── Hedges ─────────────────────────────────────────────
      for (let x = -3; x <= 3; x++) {
        placeGrid('hedge', x, 0, -13, -HALF_PI);
      }
      placeGrid('hedgeGate', 0, 0, -13, -HALF_PI);

      // ── Rocks ──────────────────────────────────────────────
      const rockPositions = [
        [20, -22, 0.4], [-18, -20, 0.3], [25, -15, 0.5],
        [-22, 15, 0.3], [22, 10, 0.4], [-25, -8, 0.5],
        [15, -25, 0.3], [-15, 28, 0.4], [28, 5, 0.3],
      ];
      rockPositions.forEach(([rx, rz, rs]) => {
        const rock = Math.random() > 0.5 ? 'rockLarge' : 'rockSmall';
        place(rock, rx, 0, rz, Math.random() * PI * 2, S * (0.8 + rs));
      });

      // Pond edge rocks
      for (let i = 0; i < 10; i++) {
        const angle = (i / 10) * PI * 2;
        place('rockSmall', 22 + Math.cos(angle) * 7.5, 0, -18 + Math.sin(angle) * 7.5,
          Math.random() * PI * 2, S * 0.6);
      }

      // ── Stairs ─────────────────────────────────────────────
      place('stairsStone', 0, 0, -25, 0, S);

      // ── Banners ────────────────────────────────────────────
      place('bannerRed', -8.5, S * 1, 4, 0, S);
      place('bannerGreen', 8.5, S * 1, 2, PI, S);

      // ── Pillars ────────────────────────────────────────────
      place('pillarStone', -3.5, 0, 33, 0, S);
      place('pillarStone',  3.5, 0, 33, 0, S);

      // ── Trees ──────────────────────────────────────────────
      const treeData = [
        // Behind windmill
        [-8, -35, 'treeHigh', 1.2], [8, -35, 'tree', 1.1], [-12, -32, 'treeCrooked', 1.0],
        [12, -32, 'treeHighRound', 1.1], [0, -38, 'treeHigh', 1.3],
        // Left perimeter
        [-20, 25, 'treeHigh', 1.1], [-22, 18, 'tree', 1.2], [-20, 10, 'treeHighRound', 0.9],
        [-22, 0, 'treeCrooked', 1.0], [-20, -10, 'treeHigh', 1.1], [-22, -22, 'tree', 1.2],
        [-18, -28, 'treeHighRound', 1.0],
        // Right perimeter
        [20, 25, 'tree', 1.0], [22, 18, 'treeHigh', 1.1], [20, 8, 'treeCrooked', 0.9],
        [25, -5, 'treeHighRound', 1.2], [22, -25, 'treeHigh', 1.0], [20, -30, 'tree', 1.1],
        // Front area
        [-12, 35, 'treeHigh', 1.0], [12, 35, 'tree', 1.1], [-6, 38, 'treeHighRound', 0.9],
        [6, 38, 'treeCrooked', 1.0], [0, 42, 'treeHigh', 1.2],
        // Scattered far
        [-35, 15, 'treeHigh', 1.4], [35, 15, 'tree', 1.3], [-30, -10, 'treeHighRound', 1.1],
        [30, -10, 'treeCrooked', 1.2], [-38, 0, 'treeHigh', 1.5], [38, 0, 'tree', 1.4],
        [-32, -25, 'tree', 1.2], [32, -25, 'treeHigh', 1.3],
        // Inside town (small decorative)
        [-5, 18, 'treeHighRound', 0.7], [5, -5, 'treeHighRound', 0.7],
        [12, 20, 'tree', 0.8], [-12, -12, 'treeCrooked', 0.8],
      ];
      treeData.forEach(([tx, tz, type, ts]) => {
        place(type, tx, 0, tz, Math.random() * PI * 2, S * ts);
      });

      // ── Extra torches near buildings ───────────────────────
      createTorch(-5, 3.5, 24);
      createTorch(4, 3.5, 22);
      createTorch(-6, 3.5, 4);
      createTorch(5, 3.5, 2);
      createTorch(-6, 3.5, -6);
      createTorch(5, 3.5, -8);
      createTorch(-6, 6, 15);
      createTorch(5, 6, 13);
    }

    // ── Pointer Lock Controls ─────────────────────────────────
    const controls = new PointerLockControls(camera, document.body);
    const blocker = document.getElementById('blocker');
    const hud = document.getElementById('hud');

    blocker.addEventListener('click', () => controls.lock());
    controls.addEventListener('lock', () => { blocker.style.display = 'none'; });
    controls.addEventListener('unlock', () => { blocker.style.display = 'flex'; });

    // ── Movement ──────────────────────────────────────────────
    let moveF = false, moveB = false, moveL = false, moveR = false;
    let canJump = false;
    const velocity = new THREE.Vector3();
    const direction = new THREE.Vector3();

    document.addEventListener('keydown', e => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp':    moveF = true; break;
        case 'KeyS': case 'ArrowDown':  moveB = true; break;
        case 'KeyA': case 'ArrowLeft':  moveL = true; break;
        case 'KeyD': case 'ArrowRight': moveR = true; break;
        case 'Space':
          if (canJump) { velocity.y = 8; canJump = false; }
          break;
      }
    });
    document.addEventListener('keyup', e => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp':    moveF = false; break;
        case 'KeyS': case 'ArrowDown':  moveB = false; break;
        case 'KeyA': case 'ArrowLeft':  moveL = false; break;
        case 'KeyD': case 'ArrowRight': moveR = false; break;
      }
    });

    // ── Resize ────────────────────────────────────────────────
    addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });

    // ── Animation Loop ────────────────────────────────────────
    const clock = new THREE.Clock();
    let elapsed = 0;

    function animate() {
      requestAnimationFrame(animate);
      const delta = Math.min(clock.getDelta(), 0.1);
      elapsed += delta;

      if (controls.isLocked) {
        velocity.x -= velocity.x * 8.0 * delta;
        velocity.z -= velocity.z * 8.0 * delta;
        velocity.y -= 25.0 * delta;

        direction.z = Number(moveF) - Number(moveB);
        direction.x = Number(moveR) - Number(moveL);
        direction.normalize();

        const speed = 35.0;
        if (moveF || moveB) velocity.z -= direction.z * speed * delta;
        if (moveL || moveR) velocity.x -= direction.x * speed * delta;

        controls.moveRight(-velocity.x * delta);
        controls.moveForward(-velocity.z * delta);
        camera.position.y += velocity.y * delta;

        if (camera.position.y < 1.6) {
          velocity.y = 0;
          camera.position.y = 1.6;
          canJump = true;
        }

        const p = camera.position;
        p.x = Math.max(-120, Math.min(120, p.x));
        p.z = Math.max(-120, Math.min(120, p.z));

        hud.textContent = `x: ${p.x.toFixed(1)}  z: ${p.z.toFixed(1)}`;
      }

      // Torch flicker
      torches.forEach((t, i) => {
        const flicker = 0.8 + Math.sin(elapsed * 8 + i * 2.5) * 0.2 +
                         Math.sin(elapsed * 13 + i * 1.7) * 0.15;
        t.light.intensity = flicker;
        t.flame.scale.setScalar(0.8 + Math.sin(elapsed * 10 + i) * 0.3);
      });

      // Particles
      const posArr = particles.geometry.attributes.position.array;
      for (let i = 0; i < particleCount * 3; i += 3) {
        posArr[i]     += pVel[i] * delta;
        posArr[i + 1] += pVel[i + 1] * delta + Math.sin(elapsed + i) * 0.002;
        posArr[i + 2] += pVel[i + 2] * delta;
        if (posArr[i] > 50) posArr[i] = -50;
        if (posArr[i] < -50) posArr[i] = 50;
        if (posArr[i + 2] > 50) posArr[i + 2] = -50;
        if (posArr[i + 2] < -50) posArr[i + 2] = 50;
        if (posArr[i + 1] > 15) posArr[i + 1] = 1;
        if (posArr[i + 1] < 0.5) posArr[i + 1] = 12;
      }
      particles.geometry.attributes.position.needsUpdate = true;

      // Water shimmer
      waterMesh.material.opacity = 0.6 + Math.sin(elapsed * 2) * 0.05;

      renderer.render(scene, camera);
    }

    // ── Init ──────────────────────────────────────────────────
    async function init() {
      await loadAllModels();
      buildTown();

      // Hide loading, show blocker
      document.getElementById('loading').style.display = 'none';
      blocker.style.display = 'flex';

      animate();
    }

    init();
  </script>
</body>
</html>
